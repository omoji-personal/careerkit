<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120"
     role="img" aria-label="CareerKit">
  <!-- THE MARK IS A GATE.
       CareerKit reads an enormous stream of job postings and lets very few through, judged
       against rails the user wrote themselves. In one real run: 19,550 in, 161 out. The
       engine's own vocabulary is rails and gates, so the gate is the mark.

       Left of the gate: a dense, irregular field. That irregularity is the point, it is
       noise, not a pattern.
       The gate itself: full-height bars, evenly set. Order applied to the stream.
       Right of the gate: a few marks, in SIGNAL, continuing on. Sparse on purpose. The
       product is the ratio, so the mark has to show the ratio.
 -->
  <defs>
    <style>
      .noise  { fill:#8D9A93; }
      .bar    { stroke:#14181C; stroke-width:2.2; stroke-linecap:butt; }
      .barlt  { stroke:#14181C; stroke-width:1.1; }
      .pass   { fill:#14654A; }
      .track  { stroke:#C3CCC7; stroke-width:1; }
      .wm     { font-family:Optima,"Avenir Next","Segoe UI",Candara,sans-serif;
                font-weight:600; font-size:37px; letter-spacing:1.5px; fill:#14181C; }
      .wm tspan.k { fill:#14654A; }
      .sub    { font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace; font-size:8px;
                letter-spacing:3.1px; fill:#5C6B63; }
      /* The mark is drawn in near-black on a transparent ground, which disappears
         on a dark canvas such as GitHub's dark theme, where it is the first thing
         in the README. Invert the ink and lift the signal so it holds contrast;
         the signal green stays the signal, only brighter. */
      @media (prefers-color-scheme: dark) {
        .bar, .barlt { stroke:#E7ECEA; }
        .wm          { fill:#E7ECEA; }
        .wm tspan.k  { fill:#3FA97F; }
        .pass        { fill:#3FA97F; }
        .noise       { fill:#7C8A83; }
        .track       { stroke:#3A4440; }
        .sub         { fill:#94A29B; }
      }
    </style>
  </defs>

  <!-- the stream's baseline, running through the gate -->
  <line class="track" x1="6" y1="40" x2="354" y2="40"/>

  <!-- NOISE: dense and irregular, approaching the gate -->
  <g class="noise">
    <circle cx="10"  cy="28" r="1.7"/><circle cx="19" cy="46" r="1.5"/><circle cx="15" cy="37" r="2"/>
    <circle cx="27"  cy="24" r="1.4"/><circle cx="31" cy="52" r="1.9"/><circle cx="24" cy="41" r="1.6"/>
    <circle cx="38"  cy="33" r="2.1"/><circle cx="43" cy="49" r="1.3"/><circle cx="35" cy="20" r="1.5"/>
    <circle cx="50"  cy="44" r="1.8"/><circle cx="47" cy="30" r="1.4"/><circle cx="55" cy="55" r="1.6"/>
    <circle cx="60"  cy="26" r="2"/>  <circle cx="64" cy="42" r="1.5"/><circle cx="57" cy="36" r="1.3"/>
    <circle cx="71"  cy="51" r="1.7"/><circle cx="75" cy="31" r="1.9"/><circle cx="68" cy="22" r="1.4"/>
    <circle cx="82"  cy="45" r="1.6"/><circle cx="86" cy="35" r="1.5"/><circle cx="79" cy="57" r="1.8"/>
    <circle cx="92"  cy="27" r="1.4"/><circle cx="96" cy="48" r="1.7"/><circle cx="89" cy="39" r="2"/>
    <circle cx="103" cy="33" r="1.5"/><circle cx="107" cy="53" r="1.6"/><circle cx="100" cy="21" r="1.3"/>
    <circle cx="113" cy="43" r="1.9"/><circle cx="117" cy="29" r="1.5"/><circle cx="110" cy="50" r="1.4"/>
    <circle cx="124" cy="37" r="1.7"/><circle cx="128" cy="24" r="1.5"/><circle cx="121" cy="56" r="1.6"/>
    <circle cx="134" cy="46" r="1.8"/><circle cx="138" cy="32" r="1.4"/><circle cx="131" cy="19" r="1.5"/>
  </g>

  <!-- THE GATE: evenly set bars. Order, applied deliberately. -->
  <g class="bar">
    <line x1="150" y1="14" x2="150" y2="66"/>
    <line x1="160" y1="14" x2="160" y2="66"/>
    <line x1="170" y1="14" x2="170" y2="66"/>
    <line x1="180" y1="14" x2="180" y2="66"/>
    <line x1="190" y1="14" x2="190" y2="66"/>
    <line x1="200" y1="14" x2="200" y2="66"/>
  </g>
  <!-- the rails the gate is hung on -->
  <g class="barlt">
    <line x1="144" y1="14" x2="206" y2="14"/>
    <line x1="144" y1="66" x2="206" y2="66"/>
  </g>

  <!-- WHAT PASSES: few, ordered, in signal -->
  <g class="pass">
    <circle cx="220" cy="40" r="2.3"/>
    <circle cx="236" cy="40" r="2.3"/>
    <circle cx="252" cy="40" r="2.3"/>
  </g>

  <text class="wm" x="6" y="103">CAREER<tspan class="k">KIT</tspan></text>
  <text class="sub" x="8" y="116">SIGNAL OUT OF NOISE</text>
</svg>
