[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerkit"
version = "1.0.0"
description = "A job search run by Claude Code, with a real sourcing engine underneath"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0", "packaging>=24.0", "requests>=2.33.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyflakes>=3.0",
  "pip-audit==2.10.1",
  "tomli>=2.0; python_version < '3.11'",
]

# CareerKit is intentionally clone-only. A wheel cannot include the Claude
# skills, setup workflow, guide, and private-state layout that make up the
# product, so publishing a console entry point would create an unsafe partial
# install that writes state inside site-packages.

[tool.setuptools]
py-modules = ["careerkit"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
