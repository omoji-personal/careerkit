name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # No network in CI: every test uses synthetic payloads and a throwaway
      # database, which is also what keeps them honest.
      # Lint as its own step, so a failure names itself rather than surfacing as
      # a confusing test failure three files away.
      - run: python -m pyflakes engine/*.py careerkit.py tests/*.py
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q careerkit.py engine tests
