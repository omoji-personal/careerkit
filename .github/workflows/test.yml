name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # No network in CI: every test uses synthetic payloads and a throwaway
      # database, which is also what keeps them honest.
      # Lint as its own step, so a failure names itself rather than surfacing as
      # a confusing test failure three files away.
      - run: bash -n setup.sh new-instance.sh run-tests.sh scripts/select-python.sh
      - run: sh -n scripts/run-careerkit.sh
      - run: python -m pyflakes engine/*.py scripts/*.py careerkit.py tests/*.py
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q careerkit.py engine scripts tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict -r requirements.txt
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pdfinfo guide/Careerkit-Guide.pdf | grep -Eq '^Pages:[[:space:]]+9$'
      - run: pdftotext guide/Careerkit-Guide.pdf "$RUNNER_TEMP/committed-guide.txt"
      - run: npm run guide
      - name: Verify committed guide is current and remains nine pages
        run: |
          test -s guide/Careerkit-Guide.pdf
          pdfinfo guide/Careerkit-Guide.pdf | grep -Eq '^Pages:[[:space:]]+9$'
          pdftotext guide/Careerkit-Guide.pdf "$RUNNER_TEMP/generated-guide.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          committed = " ".join((root / "committed-guide.txt").read_text().split())
          generated = " ".join((root / "generated-guide.txt").read_text().split())
          if committed != generated:
              raise SystemExit(
                  "guide/Careerkit-Guide.pdf is stale; run npm run guide and commit it"
              )
          PY

  windows-git-bash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Bootstrap through native Git Bash
        shell: bash
        run: ./setup.sh
      - name: Launch through the Scripts python.exe path
        shell: bash
        run: |
          ./careerkit.py --help
          .venv/Scripts/python.exe -m compileall -q careerkit.py engine scripts
          ./run-tests.sh
