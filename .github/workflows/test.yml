name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # No network in CI: every test uses synthetic payloads and a throwaway
      # database, which is also what keeps them honest.
      # Lint as its own step, so a failure names itself rather than surfacing as
      # a confusing test failure three files away.
      - run: bash -n setup.sh bootstrap.sh new-instance.sh run-tests.sh scripts/select-python.sh scripts/detect-claude.sh
      - run: sh -n scripts/run-careerkit.sh
      - run: python -m pyflakes engine/*.py scripts/*.py careerkit.py tests/*.py
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q careerkit.py engine scripts tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict -r requirements.txt
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Chromium's PDF drawing and text layout can vary between supported host
      # platforms.  The source-derived build marker is the portable freshness
      # contract; page count and content checks still guard artifact quality.
      - run: pdfinfo guide/Careerkit-Guide.pdf | grep -Eq '^Pages:[[:space:]]+9$'
      - run: pdftotext guide/Careerkit-Guide.pdf "$RUNNER_TEMP/committed-guide.txt"
      - run: npm run guide
      - name: Verify committed guide is current and remains nine pages
        run: |
          test -s guide/Careerkit-Guide.pdf
          pdfinfo guide/Careerkit-Guide.pdf | grep -Eq '^Pages:[[:space:]]+9$'
          pdftotext guide/Careerkit-Guide.pdf "$RUNNER_TEMP/generated-guide.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          marker = re.compile(r"\bGuide build ([0-9a-f]{12})\b")

          def inspect(name):
              text = (root / name).read_text()
              build_ids = marker.findall(text)
              if len(build_ids) != 1:
                  raise SystemExit(
                      f"{name} must contain exactly one Guide build <12hex> marker"
                  )
              normalized = " ".join(text.split())
              critical_text = (
                  "stops at submit for your review",
                  "never relay codes",
                  "What leaves your machine",
                  "git pull && ./setup.sh",
                  "Search Core",
                  "profile/setup-progress.md",
                  "separate activation confirmation",
                  "./bootstrap.sh",
              )
              missing = [item for item in critical_text if item not in normalized]
              if missing:
                  raise SystemExit(f"{name} is missing critical guide text: {missing}")
              return build_ids[0]

          committed_id = inspect("committed-guide.txt")
          generated_id = inspect("generated-guide.txt")
          if committed_id != generated_id:
              raise SystemExit(
                  "guide/Careerkit-Guide.pdf is stale; "
                  f"committed build {committed_id}, generated build {generated_id}; "
                  "run npm run guide and commit it"
              )
          PY

  windows-git-bash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Bootstrap through native Git Bash
        shell: bash
        run: ./setup.sh
      - name: Launch through the Scripts python.exe path
        shell: bash
        run: |
          ./careerkit.py --help
          .venv/Scripts/python.exe -m compileall -q careerkit.py engine scripts
          ./run-tests.sh
